name: Keepalive Ping

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping studio & ms.show (browser UA, 防 CDN 过滤)
        run: |
          curl -sS -A "Mozilla/5.0 Chrome/126.0" -o /dev/null \
            -w "studio %{http_code}\n" \
            "https://modelscope.cn/studios/gsym236998/seventh-witness" || true
          curl -sS -A "Mozilla/5.0 Chrome/126.0" -o /dev/null \
            -w "ms.show %{http_code}\n" \
            "https://gsym236998-seventh-witness.ms.show/" || true
